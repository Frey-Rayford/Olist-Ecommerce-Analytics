name: quality-checks

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate Python and generated JSON
        run: |
          python -m compileall src
          python -m json.tool dashboard/data/analytics.json > /dev/null
          python -m json.tool dashboard/public/delivery-data.json > /dev/null

      - name: Test cleaning, relationships and KPI export
        run: |
          python -m pip install pandas numpy
          python -m unittest discover -s tests -v

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - name: Install dashboard dependencies
        working-directory: dashboard
        run: npm ci

      - name: Lint, type-check, and build dashboard
        working-directory: dashboard
        run: npm test && npm run validate
