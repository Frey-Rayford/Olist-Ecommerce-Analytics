<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="360" viewBox="0 0 1400 360" role="img" aria-labelledby="title desc">
  <title id="title">Olist analytics project pipeline</title>
  <desc id="desc">Raw CSV files flow through Python processing, SQL Server validation, a generated JSON contract, and a Next.js dashboard.</desc>
  <rect width="1400" height="360" fill="#f4f1e9"/>
  <text x="70" y="62" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#142b3a">From marketplace files to a decision-ready data story</text>
  <text x="70" y="93" font-family="Arial, sans-serif" font-size="14" fill="#68747a">A reproducible pipeline with independent Python and SQL quality checks</text>

  <g font-family="Arial, sans-serif">
    <g transform="translate(70 135)">
      <rect width="210" height="135" rx="8" fill="#fffef9" stroke="#d9d6ce" stroke-width="2"/>
      <circle cx="35" cy="35" r="18" fill="#17324d"/><text x="35" y="40" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">01</text>
      <text x="25" y="82" font-size="20" font-weight="700" fill="#142b3a">Raw CSV</text>
      <text x="25" y="108" font-size="13" fill="#68747a">9 files · 1.55M rows</text>
    </g>
    <text x="304" y="212" font-size="30" fill="#2878b5">→</text>
    <g transform="translate(345 135)">
      <rect width="210" height="135" rx="8" fill="#fffef9" stroke="#d9d6ce" stroke-width="2"/>
      <circle cx="35" cy="35" r="18" fill="#2878b5"/><text x="35" y="40" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">02</text>
      <text x="25" y="82" font-size="20" font-weight="700" fill="#142b3a">Python</text>
      <text x="25" y="108" font-size="13" fill="#68747a">Clean · transform · test</text>
    </g>
    <text x="579" y="212" font-size="30" fill="#2878b5">→</text>
    <g transform="translate(620 135)">
      <rect width="210" height="135" rx="8" fill="#fffef9" stroke="#d9d6ce" stroke-width="2"/>
      <circle cx="35" cy="35" r="18" fill="#b8d95d"/><text x="35" y="40" text-anchor="middle" font-size="13" font-weight="700" fill="#142b3a">03</text>
      <text x="25" y="82" font-size="20" font-weight="700" fill="#142b3a">SQL Server</text>
      <text x="25" y="108" font-size="13" fill="#68747a">Model · views · KPI checks</text>
    </g>
    <text x="854" y="212" font-size="30" fill="#2878b5">→</text>
    <g transform="translate(895 135)">
      <rect width="180" height="135" rx="8" fill="#fffef9" stroke="#d9d6ce" stroke-width="2"/>
      <circle cx="35" cy="35" r="18" fill="#d94f5c"/><text x="35" y="40" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">04</text>
      <text x="25" y="82" font-size="20" font-weight="700" fill="#142b3a">JSON</text>
      <text x="25" y="108" font-size="13" fill="#68747a">Versioned data contract</text>
    </g>
    <text x="1099" y="212" font-size="30" fill="#2878b5">→</text>
    <g transform="translate(1140 135)">
      <rect width="190" height="135" rx="8" fill="#17324d" stroke="#17324d" stroke-width="2"/>
      <circle cx="35" cy="35" r="18" fill="#fffef9"/><text x="35" y="40" text-anchor="middle" font-size="13" font-weight="700" fill="#17324d">05</text>
      <text x="25" y="82" font-size="20" font-weight="700" fill="#fff">Next.js</text>
      <text x="25" y="108" font-size="13" fill="#bdcbd5">Interactive data story</text>
    </g>
  </g>
</svg>
