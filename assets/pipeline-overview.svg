<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="520" viewBox="0 0 1400 520" role="img" aria-labelledby="title desc">
<title id="title">Olist data pipeline</title>
<desc id="desc">Python cleans raw CSV files. Processed data feeds SQL Server, a dated delivery analysis, the web dashboard and Power BI. SQL queries run separately.</desc>
<rect width="1400" height="520" fill="#f5f7f8"/>
<g font-family="Arial, sans-serif" fill="#152d39">
<text x="38" y="48" font-size="27" font-weight="700">One cleaned dataset, separate analysis outputs</text>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#2878b8"/></marker></defs>
<rect x="38" y="100" width="210" height="110" rx="5" fill="white" stroke="#c4d0d6"/>
<text x="56" y="130" font-size="19" font-weight="700">Raw data</text>
<text x="56" y="157" font-size="14" fill="#526570">9 source CSVs</text>
<text x="56" y="178" font-size="14" fill="#526570">1.55 million source rows</text>
<rect x="300" y="100" width="210" height="110" rx="5" fill="white" stroke="#c4d0d6"/>
<text x="318" y="130" font-size="19" font-weight="700">Python pipeline</text>
<text x="318" y="157" font-size="14" fill="#526570">Clean and validate</text>
<text x="318" y="178" font-size="14" fill="#526570">Order-level join checks</text>
<rect x="562" y="100" width="230" height="110" rx="5" fill="white" stroke="#c4d0d6"/>
<text x="580" y="130" font-size="19" font-weight="700">Processed data</text>
<text x="580" y="157" font-size="14" fill="#526570">Relational CSVs</text>
<text x="580" y="178" font-size="14" fill="#526570">No raw files in Git</text>
<rect x="950" y="84" width="410" height="110" rx="5" fill="white" stroke="#c4d0d6"/>
<text x="968" y="114" font-size="19" font-weight="700">SQL Server</text>
<text x="968" y="141" font-size="14" fill="#526570">Staging / core / views</text>
<text x="968" y="162" font-size="14" fill="#526570">KPI queries and quality checks</text>
<rect x="562" y="310" width="230" height="110" rx="5" fill="white" stroke="#c4d0d6"/>
<text x="580" y="340" font-size="19" font-weight="700">Dated analysis</text>
<text x="580" y="367" font-size="14" fill="#526570">Cutoff: 31 Aug 2018</text>
<text x="580" y="388" font-size="14" fill="#526570">90-day follow-up</text>
<rect x="950" y="250" width="410" height="110" rx="5" fill="white" stroke="#c4d0d6"/>
<text x="968" y="280" font-size="19" font-weight="700">Next.js reports</text>
<text x="968" y="307" font-size="14" fill="#526570">Overview: analytics.json</text>
<text x="968" y="328" font-size="14" fill="#526570">Delivery: delivery-data.json</text>
<rect x="950" y="380" width="410" height="110" rx="5" fill="white" stroke="#c4d0d6"/>
<text x="968" y="410" font-size="19" font-weight="700">Power BI</text>
<text x="968" y="437" font-size="14" fill="#526570">Local fact and cohort CSVs</text>
<text x="968" y="458" font-size="14" fill="#526570">TMDL model / DAX / PBIR pages</text>
<polyline points="248,155 290,155" fill="none" stroke="#2878b8" stroke-width="2" marker-end="url(#arrow)"/>
<polyline points="510,155 552,155" fill="none" stroke="#2878b8" stroke-width="2" marker-end="url(#arrow)"/>
<polyline points="792,145 940,145" fill="none" stroke="#2878b8" stroke-width="2" marker-end="url(#arrow)"/>
<polyline points="677,210 677,300" fill="none" stroke="#2878b8" stroke-width="2" marker-end="url(#arrow)"/>
<polyline points="792,185 850,185 850,274 940,274" fill="none" stroke="#2878b8" stroke-width="2" marker-end="url(#arrow)"/>
<polyline points="792,350 865,350 865,325 940,325" fill="none" stroke="#2878b8" stroke-width="2" marker-end="url(#arrow)"/>
<polyline points="792,380 865,380 865,420 940,420" fill="none" stroke="#2878b8" stroke-width="2" marker-end="url(#arrow)"/>
</g></svg>
